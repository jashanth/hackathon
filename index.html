<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#07060a" />
    <meta name="description" content="KGRCET's HACKATHON 2027 — A 36-Hour National Level Hackathon organized by KG Reddy College of Engineering & Technology and Cybersecurity & Ethical Hacking Club." />
    <title>KGRCET's HACKATHON 2027 | A 36-Hour National Level Hackathon</title>

    <!-- Display, body, and metadata fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <script>
      (() => {
        let saved = null;
        try { saved = localStorage.getItem('kgrcet-theme'); } catch { /* Theme preference is optional. */ }
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
